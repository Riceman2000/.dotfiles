# Lock screen. Started by hypridle (Super+Escape runs `loginctl lock-session`).
# The PAM service comes from programs.hyprlock.enable in nix-config.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Same image as the desktop (hyprpaper.conf), unblurred. The logo fills roughly
# 130 px above and below the centre of each 1080 px screen, so the clock sits above
# it and the password box below it.
background {
    monitor =
    path = ~/Pictures/Wallpapers/wallpaper.png
}

# Clock (24 h, as in GNOME)
label {
    monitor =
    text = $TIME
    font_family = Paper Mono
    font_size = 72
    color = rgba(232, 232, 230, 1.0)
    position = 0, 320
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_family = Paper Mono
    font_size = 20
    color = rgba(232, 232, 230, 0.8)
    position = 0, 230
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(30, 30, 30, 0.6)
    font_color = rgba(255, 255, 255, 0.95)
    check_color = rgba(51, 204, 255, 0.9)
    fail_color = rgba(224, 27, 36, 0.9)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 12
    position = 0, -240
    halign = center
    valign = center
}
