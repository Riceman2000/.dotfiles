# fuzzel: the picker behind the clipboard history (Super+Shift+V), emoji (Super+.)
# and power menu (Ctrl+Alt+Delete). Apps are launched with hyprlauncher.

[main]
font=Paper Mono:size=12,FiraCode Nerd Font Propo:size=12
icon-theme=Adwaita
terminal=ghostty -e
layer=overlay
width=45
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
background=1e1e1ef2
text=ffffffff
prompt=9a9996ff
input=ffffffff
match=33ccffff
selection=3584e4ff
selection-text=ffffffff
selection-match=ffffffff
border=33ccffcc

[border]
width=2
radius=12
