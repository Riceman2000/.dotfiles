# Idle handling, matching GNOME on ricepc:
#   org.gnome.desktop.session idle-delay = 900       -> lock + blank after 15 min
#   power sleep-inactive-ac-type = 'nothing'         -> never suspend on its own
# A fullscreen window (rules.lua) or a Wayland idle inhibitor (waybar's
# idle_inhibitor button, some video players) pauses all of this.
#
# With a Lua Hyprland config, `hyprctl dispatch` takes a Lua dispatcher.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

    # Ignore apps' D-Bus screensaver inhibits. Discord (Electron) holds one the
    # whole time it runs, which stopped the screens from ever turning off.
    # Games and videos still count when fullscreen (rules.lua).
    ignore_dbus_inhibit = true
}

# Already locked (e.g. Super+Escape): turn the screens off after a minute.
listener {
    timeout = 60
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Lock.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Turn the screens off shortly after locking.
listener {
    timeout = 910
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Suspend is off, as in GNOME. Uncomment to suspend after an hour idle.
# listener {
#     timeout = 3600
#     on-timeout = systemctl suspend
# }
