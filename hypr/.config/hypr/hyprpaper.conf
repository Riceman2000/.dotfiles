# hyprpaper 0.8 (new block syntax). An empty monitor means every output.
#
# Logo centred on black at the monitors' native 1920x1080, so "cover" shows it 1:1
# with no scaling or cropping. The image (and its source SVG, wallpaper.svg) lives
# outside this repo, in ~/Pictures/Wallpapers.

splash = false

wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers/wallpaper.png
    fit_mode = cover
}
